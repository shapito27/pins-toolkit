<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1808px;height:1488px;background:#fff;font-family:Poppins,sans-serif;color:#2a1f2d;overflow:hidden}
.bar{height:150px;background:#f3f1f4;display:flex;align-items:center;padding:0 56px;gap:22px;border-bottom:3px solid #e7e3e9}
.dot{width:34px;height:34px;border-radius:50%;background:#d3ced6}
.url{margin-left:26px;background:#fff;border:3px solid #e2dde5;border-radius:60px;padding:16px 44px;font-size:44px;color:#6b6170}
.head{display:flex;justify-content:space-between;align-items:center;padding:60px 72px 44px}
.seed{font-size:54px;color:#6b6170}
.seed b{display:block;font-size:92px;font-weight:700;color:#2a1f2d;line-height:1.1}
.vol{text-align:right;font-size:44px;color:#6b6170;line-height:1.2}
.vol b{display:block;font-size:124px;font-weight:700;color:#d92b4b;line-height:1}
.row{display:flex;align-items:center;padding:0 72px;height:208px;border-top:3px solid #efecf1}
.kw{flex:1;font-size:66px;font-weight:500;white-space:nowrap}
.track{flex:none;width:280px;height:28px;border-radius:14px;background:#efecf1;margin:0 44px;overflow:hidden}
.fill{height:100%;border-radius:14px;background:linear-gradient(90deg,#d92b4b,#f5a623)}
.n{width:230px;text-align:right;font-size:68px;font-weight:700}
</style></head><body>
<div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">pinterest.com · Keyword Explorer</span></div>
<div class="head">
  <div class="seed">Seed keyword<b>bedroom ideas</b></div>
  <div class="vol"><b>7.1M</b>monthly searches</div>
</div>
<div class="row"><span class="kw">room inspo ideas</span><span class="track"><span class="fill" style="display:block;width:100%"></span></span><span class="n">873K</span></div>
<div class="row"><span class="kw">bedroom ideas for small rooms</span><span class="track"><span class="fill" style="display:block;width:74%"></span></span><span class="n">642K</span></div>
<div class="row"><span class="kw">cozy bedroom ideas</span><span class="track"><span class="fill" style="display:block;width:69%"></span></span><span class="n">606K</span></div>
<div class="row"><span class="kw">minimalist bedroom</span><span class="track"><span class="fill" style="display:block;width:66%"></span></span><span class="n">576K</span></div>
<div class="row"><span class="kw">guest bedroom ideas</span><span class="track"><span class="fill" style="display:block;width:52%"></span></span><span class="n">455K</span></div>
</body></html>
