<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1808px;height:1736px;background:#fff;font-family:Poppins,sans-serif;color:#2a1f2d;overflow:hidden}
.bar{height:150px;background:#f3f1f4;display:flex;align-items:center;padding:0 56px;gap:22px;border-bottom:3px solid #e7e3e9}
.dot{width:34px;height:34px;border-radius:50%;background:#d3ced6}
.url{margin-left:26px;background:#fff;border:3px solid #e2dde5;border-radius:60px;padding:16px 44px;font-size:44px;color:#6b6170}
.grid{display:flex;gap:56px;padding:64px 72px 0}
.card{position:relative;flex:1;height:1640px;border-radius:56px 56px 0 0;overflow:hidden}
.c1{background:linear-gradient(160deg,#c9b79c 0%,#8f9b7a 45%,#5d6f58 100%)}
.c2{background:linear-gradient(200deg,#e2c3a4 0%,#c98f6b 50%,#8a5a44 100%)}
.ov{position:absolute;left:0;top:90px;width:86%;background:rgba(255,255,255,.88);border-radius:0 36px 36px 0;padding:22px 40px 22px 44px}
.r{display:flex;align-items:baseline;justify-content:space-between;height:236px;padding-top:70px;border-top:3px solid rgba(42,31,45,.1)}
.r:first-child{border-top:0}
.l{font-size:52px;font-weight:500;color:#5a505e}
.n{font-size:86px;font-weight:700}
.r.top .n{color:#d92b4b}
</style></head><body>
<div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">Pin Stats</span></div>
<div class="grid">
  <div class="card c1"><div class="ov">
    <div class="r top"><span class="l">Saves</span><span class="n">29,429</span></div>
    <div class="r"><span class="l">Repins</span><span class="n">571</span></div>
    <div class="r"><span class="l">Likes</span><span class="n">1,981</span></div>
    <div class="r"><span class="l">Comments</span><span class="n">17</span></div>
    <div class="r"><span class="l">Pin age</span><span class="n">1 M</span></div>
  </div></div>
  <div class="card c2"><div class="ov">
    <div class="r top"><span class="l">Saves</span><span class="n">16,947</span></div>
    <div class="r"><span class="l">Repins</span><span class="n">545</span></div>
    <div class="r"><span class="l">Likes</span><span class="n">1,041</span></div>
    <div class="r"><span class="l">Comments</span><span class="n">4</span></div>
    <div class="r"><span class="l">Pin age</span><span class="n">1 Y</span></div>
  </div></div>
</div>
</body></html>
